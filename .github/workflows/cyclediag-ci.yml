name: cyclediag-ci

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-core:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MPLBACKEND: Agg
      GIT_LFS_SKIP_SMUDGE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        shell: bash
        run: |
          python -m pip install -U pip
          if [ "${{ matrix.python }}" = "3.14" ]; then
            python -m pip install -c constraints/py314.txt -r requirements.txt -e "./cyclediag[dev,reports]"
          else
            python -m pip install -r requirements.txt -e "./cyclediag[dev,reports]"
          fi
      - name: Record resolved dependencies
        run: python -m pip freeze > resolved-dependencies.txt
      - name: Assert portable slide dependency
        run: python -c "import pptx"
      - name: All unit tests (LFS-dependent skips remain visible)
        run: python -m pytest cyclediag/tests -q --tb=short -rs -W error::RuntimeWarning --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-${{ matrix.os }}-${{ matrix.python }}
          path: |
            test-results.xml
            resolved-dependencies.txt
          retention-days: 14
